<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stop</title>
<style>
:root{
  --bg:#eceff1;--navy:#0f1c26;--ink:#16293a;--muted:#6f8190;--panel:#fff;--line:#dde4e7;
  --water:#bfdfeb;--land:#f6f7f4;--park:#dfeada;--ok:#12855a;--warn:#df7430;--blue:#0d7fca;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.top{height:58px;background:var(--navy);color:#fff;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:900;letter-spacing:.12em}
.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#0d8973;font-size:11px}
.feed{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:#cfdce4}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px #12855a22}
.dot.bad{background:var(--warn);box-shadow:0 0 0 4px #df743022}
.layout{height:calc(100vh - 58px);padding:12px;display:grid;grid-template-columns:232px minmax(0,1fr) 320px;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px #0f1c2610;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.head{padding:13px 14px;border-bottom:1px solid var(--line)}
h2{font-size:14px;margin:0;font-weight:900}
.sub{font-size:11px;color:var(--muted);margin:5px 0 0;line-height:1.45}
.body{padding:12px;overflow:auto;flex:1;min-height:0}
.group{margin-bottom:14px}
.group-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:#51646f;font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
.small-actions{display:flex;gap:4px}
.small-actions button,.tool,.mapbtn{border:1px solid var(--line);background:#f7f9f9;color:#4f6370;border-radius:6px;font-size:10px;font-weight:800;padding:4px 7px}
.small-actions button:hover{background:#edf3f1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:5px 8px;font-size:11px;font-weight:900;opacity:.45}
.chip.on{opacity:1;color:#fff;border-color:var(--c);background:var(--c)}
.chip:focus-visible{outline:3px solid #0d7fca55;outline-offset:2px}
.map-panel{position:relative;overflow:hidden;background:#d7e9f0;display:block}
.map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;display:block}
.map.drag{cursor:grabbing}
.city{fill:var(--land);stroke:#c4d1d3;stroke-width:1;vector-effect:non-scaling-stroke}
.park{fill:var(--park)}
.lake{fill:var(--water)}
.river{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.route-case{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.7}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.78}
.station{fill:#fff;stroke:#536a78;vector-effect:non-scaling-stroke}
.hub{fill:#14293a;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.label{fill:#243b4b;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.station-label-bg{fill:#ffffffee;stroke:#c7d3d8;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.district{fill:#8598a3;font-weight:800;letter-spacing:.12em;text-transform:uppercase;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.train{cursor:pointer}
.train text{fill:#fff;font-size:9px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.train .body{stroke:#fff;stroke-width:2}
.train .halo{fill:none;stroke:#0d7fca;stroke-width:2.5}
.train .late{fill:var(--warn);stroke:#fff;stroke-width:1}
.toolbar{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:5px}
.tool{width:32px;height:32px;padding:0;background:#fffffff2;color:var(--ink);font-size:15px;box-shadow:0 3px 10px #0f1c2618}
.status{position:absolute;left:12px;top:12px;background:#fffffff2;border:1px solid #0f1c261f;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800;box-shadow:0 3px 10px #0f1c2618;display:flex;gap:7px;align-items:center}
.mapbtns{position:absolute;left:12px;top:52px;display:flex;gap:5px}
.mapbtn{background:#fffffff2;box-shadow:0 3px 10px #0f1c2618;padding:6px 9px}
.legend{position:absolute;left:12px;bottom:12px;background:#fffffff2;border:1px solid #0f1c261f;border-radius:9px;padding:8px 10px;display:flex;gap:10px;flex-wrap:wrap;font-size:10px;font-weight:800;color:#51646f}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:4px}
.legend i.warn{background:var(--warn)}
.zoomlabel{position:absolute;right:12px;bottom:12px;background:#fffffff2;border:1px solid #0f1c261f;border-radius:9px;padding:6px 9px;font-size:10px;font-weight:900;color:#51646f}
.route.active{opacity:1!important;filter:drop-shadow(0 0 3px rgba(0,0,0,.35))}
.route.dimmed,.route-case.dimmed{opacity:.12}
.stopover-mark{fill:#fff;stroke:#0f1c26;stroke-width:2}
.disruption-bar{display:flex;gap:10px;align-items:flex-start;background:#fff4e2;border-bottom:1px solid #f0c98a;padding:9px 16px;position:relative}
.disruption-bar.hidden{display:none}
.db-icon{font-size:15px;line-height:1.4;color:var(--warn)}
.db-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;max-height:96px;overflow:auto}
.db-item{font-size:11.5px;line-height:1.4;color:#5b3f10}
.db-item b{color:#3a2707;margin-right:5px}
.db-empty{font-size:11px;color:#8a6a2e}
.db-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.db-close{border:0;background:transparent;color:#8a6a2e;font-size:16px;font-weight:900;cursor:pointer;line-height:1;padding:0 2px}
.db-refresh{font-size:9px;color:#8a6a2e;font-weight:800;white-space:nowrap}
.trajectory{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.trajectory-row{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:11px;border-bottom:1px solid #eef2f3;background:#fff}
.trajectory-row:last-child{border-bottom:0}
.trajectory-row.current{background:#edf6f3;font-weight:800}
.trajectory-dot{width:7px;height:7px;border-radius:50%;background:#c3cdd2;flex:none}
.trajectory-row.current .trajectory-dot{background:var(--ok)}
.trajectory-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trajectory-eta{font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap}
.trajectory-eta.late{color:var(--warn)}
.search{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:#f8faf9;padding:0 10px;outline:0;font-size:12px;margin-top:10px}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0d7fca22}
.train-list{overflow:auto;flex:1;min-height:120px}
.train-row{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;border:0;border-bottom:1px solid #eef2f3;background:#fff;width:100%;padding:9px 12px;text-align:left}
.train-row:hover,.train-row.selected{background:#edf6f3}
.badge{height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;background:var(--c);font-size:10px;font-weight:900}
.train-row b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.train-row small{display:block;margin-top:3px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta{font-size:10px;font-weight:900;color:var(--ok);white-space:nowrap}
.eta.late{color:var(--warn)}
.empty{padding:18px 14px;color:var(--muted);font-size:11px}
.detail{border-top:1px solid var(--line);padding:12px;background:#fbfcfc}
.detail h3{margin:0;font-size:13px;display:flex;gap:7px;align-items:center}
.detail p{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.kv div{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px}
.kv span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.kv b{display:block;margin-top:3px;font-size:11px}
.footer{padding:9px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px}
.footer a,.footer button{color:var(--ink);font-weight:800;text-decoration:none;border:0;background:transparent;padding:0;font-size:10px}
@media(max-width:1150px){.layout{grid-template-columns:210px 1fr;grid-template-rows:minmax(460px,1fr) auto;height:auto}.trains{grid-column:1/-1}}
@media(max-width:720px){.layout{display:block;height:auto;padding:8px}.panel{margin-bottom:9px}.map-panel{height:66vh;min-height:400px}.train-list{max-height:300px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">S</span> STOP</div>
  <div class="feed"><span class="dot" id="feedDot"></span><span id="feedText">connecting…</span></div>
</header>
<div class="disruption-bar" id="disruptionBar">
  <span class="db-icon">⚠</span>
  <div class="db-content" id="disruptionContent"><div class="db-empty">Checking for service disruptions…</div></div>
  <div class="db-actions">
    <button class="db-close" id="disruptionClose" title="Dismiss" aria-label="Dismiss disruption notice">×</button>
    <span class="db-refresh" id="disruptionRefresh">—</span>
  </div>
</div>
<main class="layout">
  <section class="panel">
    <div class="head"><h2>Lines</h2><p class="sub">Only selected lines are drawn — keeps the map readable.</p></div>
    <div class="body" id="lineBox"></div>
    <div class="footer"><span id="lineCount">—</span><a href="https://www.vbb.de/fahrinfo/" target="_blank" rel="noopener">VBB ↗</a></div>
  </section>

  <section class="panel map-panel">
    <svg class="map" id="map" viewBox="0 0 1000 700" aria-label="Live Berlin rail map"></svg>
    <div class="status"><span class="dot" id="mapDot"></span><span id="mapStatus">Loading live positions…</span></div>
    <div class="mapbtns">
      <button class="mapbtn" id="toggleNames">Station names</button>
      <button class="mapbtn" id="toggleRoutes">Routes</button>
    </div>
    <div class="toolbar">
      <button class="tool" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="tool" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
      <button class="tool" id="reset" title="Reset view" aria-label="Reset view">⤾</button>
    </div>
    <div class="legend"><span><i></i>on time</span><span><i class="warn"></i>delayed</span><span>Click a train for next stop &amp; ETA</span></div>
    <div class="zoomlabel" id="zoomLabel">1.0×</div>
  </section>

  <section class="panel trains">
    <div class="head"><h2>Live trains</h2><p class="sub" id="trainSub">—</p>
      <input class="search" id="search" placeholder="Filter by line or destination" aria-label="Filter trains"></div>
    <div class="train-list" id="trainList"></div>
    <div class="detail" id="detail"><p>Click a train on the map or in the list to see its next station and ETA.</p></div>
    <div class="footer"><span id="updated">—</span><button id="refresh">Refresh now</button></div>
  </section>
</main>

   station labels, disruption notices, or trajectories while the BVG mirror is available. */
async function fetchApi(path,options={}){
  let lastErr=null;
  for(let attempt=0;attempt<RADAR_HOSTS.length;attempt++){
    const hostIdx=(activeHost+attempt)%RADAR_HOSTS.length;
    try{
      const r=await fetch(RADAR_HOSTS[hostIdx]+'/'+String(path).replace(/^\//,''),{cache:'no-store',...options});
      if(!r.ok)throw new Error('http '+r.status);
      activeHost=hostIdx;

/* ---------- state ---------- */
const NS='http://www.w3.org/2000/svg';
const map=document.getElementById('map');
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let layer=null, trainLayer=null, stationLayer=null;
const routeShapes={};
const networkStops={};
const stationCatalog={};
let networkSource='local fallback';
const state={hidden:new Set(ALL.filter(l=>!DEFAULT_ON.includes(l))),trains:[],selected:null,q:'',z:1,tx:0,ty:0,
  routes:true,names:true,streets:true,live:false,stale:false,lastLive:null,busy:false,countdown:REFRESH_MS/1000,
  disruptions:[],disruptDismissed:false,disruptCountdown:DISRUPT_REFRESH_MS/1000,disruptBusy:false};

function node(tag,a,parent){const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);(parent||layer).appendChild(n);return n}
const poly=pts=>pts.map((p,i)=>{const[x,y]=xy(p[0],p[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
function lineStops(line){return networkStops[line]?.length?networkStops[line]:lines[line]}
function routePath(stops){
  return stops.filter(s=>coords[s]).map((s,i)=>{const[x,y]=xy(...coords[s]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
}
function lineStopName(s){return String(s?.name||s?.stop?.name||'').replace(/^(S\+U|U|S|RE|RB)\s+/i,'').replace(/\s+\(Berlin\)$/i,'').trim()}
function rebuildStaticMap(){buildMap();styleMap();renderMarkers()}
function shapePath(points){
  return (points||[]).map((p,i)=>{const lat=Number(p[0]??p.latitude),lon=Number(p[1]??p.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon))return '';const[x,y]=xy(lat,lon);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).filter(Boolean).join(' ');
}
function networkLineName(v){return String(v?.name||v?.line?.name||'').replace(/\s+/g,'').toUpperCase()}
function extractShape(v){
  const g=v?.geometry||v?.shape||v?.polyline||v?.path||v?.geojson;
  const pts=g?.type==='Feature'?g.geometry?.coordinates:g?.type==='LineString'?g.coordinates:g;
  if(!Array.isArray(pts))return null;
  const out=pts.map(p=>Array.isArray(p)?(Math.abs(Number(p[0]))>90?[Number(p[1]),Number(p[0])]:[Number(p[0]),Number(p[1])]):[Number(p.latitude),Number(p.longitude)]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));
  return out.length>1?out:null;
}
function extractStops(v){
  const raw=v?.stops||v?.stopovers||v?.stations||[];
  if(!Array.isArray(raw))return [];
  return raw.map(s=>{
    const o=s?.stop||s?.station||s;
    if(typeof o==='string'||typeof o==='number'){const c=stationCatalog[String(o)];if(!c)return '';coords[c.name]=[c.lat,c.lon];return c.name}
    const name=lineStopName(o); const lat=Number(o?.location?.latitude??o?.latitude),lon=Number(o?.location?.longitude??o?.longitude);
    if(name&&Number.isFinite(lat)&&Number.isFinite(lon)){coords[name]=[lat,lon];return name} return name;
  }).filter(Boolean);
}
async function fetchShape(id){
  if(!id)return null;
  try{const r=await fetchApi('shapes/'+encodeURIComponent(id));if(!r.ok)return null;return extractShape(await r.json())}catch(e){return null}
}
async function loadNetwork(){
  try{
    const [lr,sr]=await Promise.all([
      fetchApi('lines?variants=true&mode=train&pretty=false'),
      fetchApi('stations?pretty=false')
    ]);
    if(!lr.ok)throw Error('network');
    if(sr.ok){const sp=await sr.json();const stations=Array.isArray(sp)?sp:Object.values(sp||{});stations.forEach(st=>{const loc=st.location||{};const lat=Number(loc.latitude),lon=Number(loc.longitude);if(Number.isFinite(lat)&&Number.isFinite(lon)){const names=[st.id,...(st.stops||[]).map(x=>x.id)].filter(Boolean);names.forEach(id=>stationCatalog[String(id)]={name:lineStopName(st),lat,lon})}})}
    const payload=await lr.json();
    const records=Array.isArray(payload)?payload:(Array.isArray(payload.lines)?payload.lines:Object.values(payload||{}).filter(v=>v&&typeof v==='object'));
    let found=0;
    for(const target of ALL){
      const rec=records.find(x=>networkLineName(x)===target);if(!rec)continue;
      const stops=[];const variants=Array.isArray(rec.variants)?rec.variants:[rec];
      for(const variant of variants){const got=extractStops({stops:Array.isArray(variant)?variant:variant.stops||variant.stopovers||[]});if(got.length>stops.length)stops.splice(0,stops.length,...got)}
      const direct=extractStops(rec);if(direct.length>stops.length)stops.splice(0,stops.length,...direct);
      if(stops.length>1)networkStops[target]=stops;
      const ids=[rec.id,rec.shapeId,rec.line?.id].filter(Boolean);
      for(const id of ids){const shape=await fetchShape(id);if(shape){routeShapes[target]=shapePath(shape);break}}
      if(networkStops[target]?.length||routeShapes[target])found++;
    }
    if(found){networkSource='VBB network data';rebuildStaticMap();el('mapStatus').textContent=state.live?el('mapStatus').textContent:'VBB network loaded'}
  }catch(err){networkSource='local fallback'}
}

/* ---------- service disruptions / construction notices ---------- */
function remarkKey(r){return String(r?.id||r?.code||'')+'|'+String(r?.summary||r?.text||'').slice(0,120)}
function remarkSeverity(r){
  const t=String(r?.type||'').toLowerCase();
  if(t==='warning'||t==='status')return 'warning';
  return 'info';
}
function isConstructionLike(r){
  const s=String(r?.summary||r?.text||'').toLowerCase();
  return /bauarbeit|baustelle|construction|gesperrt|ersatzverkehr|umleitung|ausfall|störung|stoerung|disrupt|closed|closure|halt entfällt|entfällt/.test(s);
}
async function fetchStopRemarks(stop){
  try{
    const r=await fetchApi(`stops/${encodeURIComponent(stop.id)}/departures?duration=30&remarks=true&pretty=false`);
    if(!r.ok)return [];
    const p=await r.json();
    const deps=Array.isArray(p)?p:(p.departures||[]);
    const out=[];
    deps.forEach(d=>{
      (d.remarks||[]).forEach(rem=>{
        if(remarkSeverity(rem)!=='warning'&&!isConstructionLike(rem))return;
        const text=String(rem.summary||rem.text||'').trim();
        if(!text)return;
        out.push({key:remarkKey(rem),text,line:String(d.line?.name||'').toUpperCase(),stop:stop.name});
      });
    });
    return out;
  }catch(e){return []}
}
async function loadDisruptions(){
  if(state.disruptBusy)return;state.disruptBusy=true;
  try{
    const batches=await Promise.all(DISRUPT_STOPS.map(fetchStopRemarks));
    const merged=new Map();
    batches.flat().forEach(d=>{
      if(!merged.has(d.key))merged.set(d.key,{text:d.text,lines:new Set(),stops:new Set()});
      const m=merged.get(d.key);
      if(d.line)m.lines.add(d.line);
      m.stops.add(d.stop);
    });
    state.disruptions=[...merged.values()].map(m=>({text:m.text,lines:[...m.lines],stops:[...m.stops]}));
  }catch(e){
    /* keep previous disruptions on failure; do not fabricate */
  }finally{
    state.disruptBusy=false;state.disruptCountdown=DISRUPT_REFRESH_MS/1000;renderDisruptions();
  }
}
function renderDisruptions(){
  const bar=el('disruptionBar'),content=el('disruptionContent'),refresh=el('disruptionRefresh');
  if(state.disruptDismissed){bar.classList.add('hidden');return}
  bar.classList.remove('hidden');
  if(!state.disruptions.length){
    content.innerHTML='<div class="db-empty">No active construction or disruption notices reported at major hubs right now.</div>';
  }else{
    content.innerHTML=state.disruptions.slice(0,20).map(d=>
      `<div class="db-item">${d.lines.length?'<b>'+d.lines.map(esc).join('/')+'</b>':''}${esc(d.text)}${d.stops.length?' <span style="color:#a3823a">('+esc(d.stops.slice(0,2).join(', '))+')</span>':''}</div>`
    ).join('');
  }
  refresh.textContent=`checked ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · next in ${Math.max(0,Math.round(state.disruptCountdown))}s`;
}

/* ---------- trajectory (full trip stopovers) ---------- */
const tripCache=new Map();
async function fetchTrip(tripId){
  if(!tripId)return null;
  if(tripCache.has(tripId))return tripCache.get(tripId);
  try{
    const r=await fetchApi(`trips/${encodeURIComponent(tripId)}?stopovers=true&remarks=true&polyline=false&pretty=false`);
    if(!r.ok)throw new Error('http');
    const p=await r.json();
    const trip=p.trip||p;
    tripCache.set(tripId,trip);
    return trip;
  }catch(e){return null}
}
function renderTrajectory(stopovers,currentName){
  if(!stopovers||!stopovers.length)return '<p>No detailed stopover list reported for this trip.</p>';
  let passed=true;
  const rows=stopovers.map(s=>{
    const name=lineStopName(s.stop||s);
    const isCurrent=name===currentName;
    if(isCurrent)passed=false;
    const when=s.arrival||s.plannedArrival||s.departure||s.plannedDeparture;
    let etaTxt='—';let late=false;
    if(typeof when==='string'){
      const ms=Date.parse(when);
      if(Number.isFinite(ms)){const min=Math.round((ms-Date.now())/60000);etaTxt=min<=0?'due':min+' min'}
    }
    const delaySec=s.arrivalDelay??s.departureDelay;
    if(Number.isFinite(Number(delaySec))&&Number(delaySec)>=60){late=true;etaTxt+=' (+'+Math.round(Number(delaySec)/60)+')'}
    return `<div class="trajectory-row${isCurrent?' current':''}"${passed&&!isCurrent?' style="opacity:.5"':''}>
      <span class="trajectory-dot"></span><span class="trajectory-name">${esc(name)}</span>
      <span class="trajectory-eta${late?' late':''}">${etaTxt}</span></div>`;
  });
  return `<div class="trajectory">${rows.join('')}</div>`;
}
function highlightRoute(line){
  layer.querySelectorAll('.route,.route-case').forEach(n=>{
    n.classList.remove('active','dimmed');
    if(!line)return;
    if(n.dataset.line===line)n.classList.add('active');else n.classList.add('dimmed');
  });
}

/* ---------- build static map ---------- */
function buildMap(){
  map.innerHTML='';
  const view=document.createElementNS(NS,'g');view.id='view';map.appendChild(view);layer=view;
  node('rect',{x:-2000,y:-2000,width:5000,height:5000,fill:'#d7e9f0'});
  node('path',{class:'city',d:poly(BORDER)+'Z'});
  PARKS.forEach(p=>node('path',{class:'park',d:poly(p)+'Z'}));
  LAKES.filter(l=>l.p.length).forEach(l=>node('path',{class:'lake',d:poly(l.p)+'Z'}));
  node('path',{class:'river',id:'havel',d:poly(HAVEL),'stroke-width':7});
  node('path',{class:'river',id:'spree',d:poly(SPREE),'stroke-width':5});
  node('path',{class:'river',id:'dahme',d:poly(DAHME),'stroke-width':4});
  node('path',{class:'river',id:'landwehrkanal',d:poly(LANDWEHRKANAL),'stroke-width':2.6});
  const sg=node('g',{id:'streets'});
  STREETS.forEach(s=>{
    const d=poly(s.p);
    node('path',{class:'street-case',d,'stroke-width':s.w+1.2},sg);
    node('path',{class:'street',d,'stroke-width':s.w},sg);
  });
  DISTRICTS.forEach(([n,lat,lon])=>{
    const[x,y]=xy(lat,lon);
    const lines=n.split('\n');
    lines.forEach((ln,i)=>{
      const t=node('text',{class:'district',x,y:y+i*10,'font-size':9});
      t.textContent=ln;
    });
  });

  const rg=node('g',{id:'routes'});
  ALL.forEach(line=>{
    const d=routeShapes[line]||routePath(lineStops(line));if(!d)return;
    const w=line[0]==='U'?2.5:line[0]==='S'?2.1:1.8;
    node('path',{class:'route-case',d,'stroke-width':w+1.8,'data-line':line},rg);
    const p=node('path',{class:'route',d,stroke:colors[line]||'#5d7280','stroke-width':w,'data-line':line},rg);
    if(line[0]==='R')p.setAttribute('stroke-dasharray','8 6');
  });

  stationLayer=node('g',{id:'stations'});
  const stationLines={};ALL.forEach(l=>lineStops(l).forEach(s=>(stationLines[s]??=[]).push(l)));
  const used=new Set();ALL.forEach(l=>lineStops(l).forEach(s=>used.add(s)));
  const seen=new Set();
  used.forEach(name=>{
    const c=coords[name];if(!c)return;
    const key=c[0].toFixed(4)+','+c[1].toFixed(4);if(seen.has(key))return;seen.add(key);
    const[x,y]=xy(...c);
    const hub=HUBS.includes(name), tier=hub?0:MAJOR.includes(name)?1:2;
    const g=node('g',{'data-tier':tier,'data-lines':(stationLines[name]||[]).join(',')},stationLayer);
    node('circle',{class:hub?'station hub':'station',cx:x,cy:y,r:hub?5.4:3.2,'stroke-width':hub?2.2:1.5},g);
    const t=node('text',{class:'label',x:x+8,y:y-7,'font-size':hub?13:12},g);
    t.textContent=name.replace(/\s*\(S1?\)$/,'');
    const bb=node('rect',{class:'station-label-bg',x:x+4,y:y-18,width:Math.max(42,name.length*6.2),height:17,rx:4},g);
    g.insertBefore(bb,t);
  });

  trainLayer=node('g',{id:'trains'});
  applyView();
}

/* ---------- view / zoom ---------- */
function clampView(){
  const pad=180;
  const minX=-(1000*state.z-1000)-pad, minY=-(700*state.z-700)-pad;
  state.tx=Math.min(pad,Math.max(minX,state.tx));
  state.ty=Math.min(pad,Math.max(minY,state.ty));
}
function applyView(){
  clampView();
  layer.setAttribute('transform',`translate(${state.tx.toFixed(2)} ${state.ty.toFixed(2)}) scale(${state.z.toFixed(4)})`);
  const k=1/state.z;
  /* keep strokes, markers, dots and text at constant on-screen size */
  stationLayer.querySelectorAll('g').forEach(g=>{
    const active=(g.dataset.lines||'').split(',').some(l=>!state.hidden.has(l));
    g.style.display=active?'':'none';
    if(!active)return;
    const tier=+g.dataset.tier, c=g.querySelector('circle'), t=g.querySelector('text'), bg=g.querySelector('.station-label-bg');
    const hub=tier===0;
    const dot=(hub?5.4:3.2)*k;
    c.setAttribute('r',dot.toFixed(2));
    const visible=tier===0?state.z>=1.3:(tier===1?state.z>=1.8:state.z>=2.6);
    const font=(hub?13:12)*k;
    t.setAttribute('font-size',font.toFixed(2));
    t.setAttribute('x',(+c.getAttribute('cx')+8*k).toFixed(2));
    t.setAttribute('y',(+c.getAttribute('cy')-7*k).toFixed(2));
    t.style.display=(state.names&&visible)?'':'none';
    t.style.strokeWidth=(5*k)+'px';
    if(bg){
      const w=Math.max(52,t.textContent.length*7.2)*k;
      bg.setAttribute('x',(+c.getAttribute('cx')+4*k).toFixed(2));
      bg.setAttribute('y',(+c.getAttribute('cy')-20*k).toFixed(2));
      bg.setAttribute('width',w.toFixed(2));
      bg.setAttribute('height',(20*k).toFixed(2));
      bg.setAttribute('rx',(4*k).toFixed(2));
      bg.style.display=(state.names&&visible)?'':'none';
    }
  });
  layer.querySelectorAll('.district').forEach(t=>{t.setAttribute('font-size',(9*k).toFixed(2));t.style.display=state.z<=1.8?'':'none';t.style.strokeWidth=(3*k)+'px'});
  el('havel').setAttribute('stroke-width',(7).toFixed(1));
  trainLayer.querySelectorAll('.train').forEach(g=>{
    g.setAttribute('transform',`translate(${g.dataset.x} ${g.dataset.y}) scale(${k.toFixed(4)})`);
  });
  el('zoomLabel').textContent=state.z.toFixed(1)+'×';
}
function zoom(f,cx=500,cy=350){
  const old=state.z;
  state.z=Math.max(0.9,Math.min(7,state.z*f));
  if(state.z===old)return;
  state.tx=cx-(cx-state.tx)*state.z/old;
  state.ty=cy-(cy-state.ty)*state.z/old;
  applyView();
}
const toSvg=e=>{const r=map.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*1000,y:(e.clientY-r.top)/r.height*700}};
let drag=null;
map.addEventListener('pointerdown',e=>{if(e.target.closest('.train'))return;const p=toSvg(e);drag={px:p.x,py:p.y,tx:state.tx,ty:state.ty};map.setPointerCapture(e.pointerId);map.classList.add('drag')});
map.addEventListener('pointermove',e=>{if(!drag)return;const p=toSvg(e);state.tx=drag.tx+(p.x-drag.px);state.ty=drag.ty+(p.y-drag.py);applyView()});
const endDrag=()=>{drag=null;map.classList.remove('drag')};
map.addEventListener('pointerup',endDrag);map.addEventListener('pointercancel',endDrag);map.addEventListener('pointerleave',endDrag);
map.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e);zoom(e.deltaY<0?1.18:1/1.18,p.x,p.y)},{passive:false});
map.addEventListener('dblclick',e=>{const p=toSvg(e);zoom(1.6,p.x,p.y)});

/* ---------- controls ---------- */
function renderLineBox(){
  const b=el('lineBox');b.innerHTML='';
  groups.forEach(([title,names])=>{
    const g=document.createElement('div');g.className='group';
    const allOn=names.every(n=>!state.hidden.has(n));
    g.innerHTML=`<div class="group-title"><span>${title}</span><span class="small-actions"><button data-toggle-lines="1" aria-pressed="${allOn}" aria-label="${allOn?'Hide':'Show'} all ${title} lines">${allOn?'None':'All'}</button></span></div><div class="chips"></div>`;
    const chips=g.querySelector('.chips');
    names.forEach(n=>{
      const on=!state.hidden.has(n);
      const btn=document.createElement('button');
      btn.className='chip'+(on?' on':'');btn.style.setProperty('--c',colors[n]||'#5d7280');
      btn.setAttribute('aria-pressed',String(on));btn.textContent=n;
      btn.onclick=()=>{on?state.hidden.add(n):state.hidden.delete(n);render()};
      chips.appendChild(btn);
    });
    g.querySelector('[data-toggle-lines]').onclick=()=>{
      const turnOn=!names.every(n=>!state.hidden.has(n));
      names.forEach(n=>turnOn?state.hidden.delete(n):state.hidden.add(n));
      render();
    };
    b.appendChild(g);
  });
  el('lineCount').textContent=`${ALL.length-state.hidden.size} of ${ALL.length} lines shown`;
}
function styleMap(){
  layer.querySelectorAll('[data-line]').forEach(n=>{n.style.display=(state.routes&&!state.hidden.has(n.dataset.line))?'':'none'});
  const streetLayer=el('map').querySelector('#streets');
  if(streetLayer)streetLayer.style.display=state.streets?'':'none';
  applyView();
}

/* ---------- live data ---------- */
const productOf=v=>String(v?.line?.product||v?.product||'').toLowerCase();
const isRail=v=>{const p=productOf(v),n=String(v?.line?.name||v?.line?.label||'').toUpperCase();
  return ['subway','suburban','regional','express','regionalexp'].includes(p)||/^(U|S|RE|RB)\s?\d/.test(n)};
function delayOf(v){
  const s=v?.nextStopovers?.[0];
  let raw=v?.delay??s?.arrivalDelay??s?.departureDelay;
  if(raw==null||raw==='')return 0;
  let d=Number(raw);if(!Number.isFinite(d))return 0;
  /* HAFAS delay values are seconds; tolerate feeds that already expose minutes. */
  if(Math.abs(d)>=60)d=d/60;
  return Math.max(0,Math.round(d));
}
function etaOf(v){const s=v?.nextStopovers?.[0];const t=s?.arrival||s?.plannedArrival||s?.departure;
  if(typeof t==='string'){const ms=Date.parse(t);if(Number.isFinite(ms))return Math.round((ms-Date.now())/60000)}return null}
function normalize(v,i){
  const loc=v.location||v.position||{};
  const lat=Number(loc.latitude??loc.lat),lon=Number(loc.longitude??loc.lon);
  if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;
  const line=String(v?.line?.name||v?.line?.label||'Rail').replace(/\s+/g,'').toUpperCase();
  const s=v?.nextStopovers?.[0];
  return{id:String(v.tripId||v.trip||v.id||i),line,
    destination:String(v.direction||v?.line?.direction||v?.trip?.direction||'Unknown destination'),
    next:String(s?.stop?.name||s?.stop?.station?.name||'Next stop not reported'),
    lat,lon,delay:delayOf(v),eta:etaOf(v)};
}
function visibleTrains(){
  const q=state.q.trim().toLowerCase();
  return state.trains.filter(t=>!state.hidden.has(t.line)&&(!q||[t.line,t.destination,t.next].some(v=>v.toLowerCase().includes(q))));
}
function renderTrains(){
  const list=el('trainList'),a=visibleTrains();
  el('trainSub').textContent=`${a.length} shown · ${state.trains.length} live rail vehicles`;
  list.innerHTML='';
  if(!a.length){list.innerHTML='<div class="empty">No trains match the selected lines or search. Enable more lines on the left.</div>';return}
  a.slice().sort((x,y)=>(x.eta??999)-(y.eta??999)).slice(0,120).forEach(t=>{
    const row=document.createElement('button');
    row.className='train-row'+(state.selected===t.id?' selected':'');
    row.innerHTML=`<span class="badge" style="--c:${colors[t.line]||'#5d7280'}">${esc(t.line)}</span>
      <span><b>${esc(t.destination)}</b><small>next: ${esc(t.next)}</small></span>
      <em class="eta${t.delay?' late':''}">${t.eta==null?'—':t.eta<=0?'due':t.eta+' min'}${t.delay?' +'+t.delay:''}</em>`;
    row.onclick=()=>select(t.id);
    list.appendChild(row);
  });
}
function renderMarkers(){
  trainLayer.innerHTML='';
  const a=visibleTrains(),k=1/state.z;
  a.forEach(t=>{
    const[x,y]=xy(t.lat,t.lon);
    const g=node('g',{class:'train',transform:`translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${k.toFixed(4)})`,tabindex:'0','role':'button','aria-label':`${t.line} to ${t.destination}, next stop ${t.next}`},trainLayer);
    g.dataset.id=t.id;g.dataset.x=x.toFixed(2);g.dataset.y=y.toFixed(2);
    if(state.selected===t.id)node('circle',{class:'halo',cx:0,cy:0,r:13},g);
    node('circle',{class:'body',cx:0,cy:0,r:9,fill:colors[t.line]||'#5d7280'},g);
    if(t.delay)node('circle',{class:'late',cx:7,cy:-7,r:3.4},g);
    const tx=node('text',{x:0,y:0},g);tx.textContent=t.line;
    const title=node('title',{},g);title.textContent=`${t.line} → ${t.destination}\nnext: ${t.next}${t.eta==null?'':' · '+(t.eta<=0?'due':t.eta+' min')}`;
    g.addEventListener('click',e=>{e.stopPropagation();select(t.id)});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(t.id)}});
  });
  el('mapStatus').textContent=state.live
    ?`${a.length} live trains · ${new Date(state.lastLive).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`
    :(state.stale?'Last known positions · feed unavailable':'Live positions unavailable');
}
function select(id){
  state.selected=id;
  const t=state.trains.find(x=>x.id===id);
  if(t){
    highlightRoute(t.line);
    el('detail').innerHTML=`<h3><span class="badge" style="width:42px;--c:${colors[t.line]||'#5d7280'}">${esc(t.line)}</span>${esc(t.destination)}</h3>
      <div class="kv">
        <div><span>Next station</span><b>${esc(t.next)}</b></div>
        <div><span>ETA next stop</span><b>${t.eta==null?'not reported':t.eta<=0?'arriving now':'in '+t.eta+' min'}</b></div>
        <div><span>Delay</span><b>${t.delay?'+'+t.delay+' min':'on time'}</b></div>
        <div><span>Position</span><b>${t.lat.toFixed(4)}, ${t.lon.toFixed(4)}</b></div>
      </div>
      <p>Live position from the VBB real-time radar feed, refreshed every ${REFRESH_MS/1000} seconds.</p>
      <p style="margin-top:10px;font-weight:900;color:var(--ink);font-size:11px;text-transform:uppercase;letter-spacing:.06em">Trajectory</p>
      <div id="trajectoryBox"><p>Loading full stopover list…</p></div>`;
    fetchTrip(t.id).then(trip=>{
      const box=document.getElementById('trajectoryBox');
      if(!box||state.selected!==id)return;
      const stopovers=trip?.stopovers;
      box.innerHTML=renderTrajectory(stopovers,t.next);
    });
  }else{
    highlightRoute(null);
  }
  renderTrains();renderMarkers();
}
function render(){renderLineBox();styleMap();renderTrains();renderMarkers()}

async function load(){
  if(state.busy)return;state.busy=true;
  el('feedText').textContent='updating…';
  let lastErr=null;
  /* Try the primary VBB host first, then fall back to the BVG mirror (same underlying VBB
     realtime data) if the primary is down. v6.vbb.transport.rest has had known outages where
     its upstream HAFAS backend returns 502/503 for all data endpoints. */
  for(let attempt=0;attempt<RADAR_HOSTS.length;attempt++){
    const hostIdx=(activeHost+attempt)%RADAR_HOSTS.length;
    const url=RADAR_HOSTS[hostIdx]+'/'+RADAR_QS+'&_='+Date.now();
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error('http '+r.status);
      const p=await r.json();
      const raw=Array.isArray(p)?p:(p.movements||p.vehicles||p.results||[]);
      const t=raw.filter(isRail).map(normalize).filter(Boolean);
      if(!t.length)throw new Error('empty');
      state.trains=t;state.live=true;state.stale=false;state.lastLive=Date.now();
      activeHost=hostIdx;
      const hostLabel=hostIdx===0?'':' (via BVG mirror)';
      el('feedText').textContent='live · every '+(REFRESH_MS/1000)+'s'+hostLabel;
      el('feedDot').classList.remove('bad');el('mapDot').classList.remove('bad');
      lastErr=null;
      break;
    }catch(err){lastErr=err}
  }
  if(lastErr){
    state.live=false;state.stale=state.trains.length>0;
    el('feedText').textContent=state.stale?'last known positions · feed unavailable':'live feed unavailable (VBB/BVG both unreachable)';
    el('feedDot').classList.add('bad');el('mapDot').classList.add('bad');
    if(!state.trains.length)state.trains=[];
  }
  state.busy=false;state.countdown=REFRESH_MS/1000;render();
}

/* ---------- ui wiring ---------- */
el('zoomIn').onclick=()=>zoom(1.35);
el('zoomOut').onclick=()=>zoom(1/1.35);
el('reset').onclick=()=>{state.z=1;state.tx=0;state.ty=0;applyView()};
el('toggleRoutes').onclick=()=>{state.routes=!state.routes;el('toggleRoutes').style.opacity=state.routes?1:.55;styleMap()};
el('toggleNames').onclick=()=>{state.names=!state.names;el('toggleNames').style.opacity=state.names?1:.55;applyView()};
el('toggleStreets').onclick=()=>{state.streets=!state.streets;el('toggleStreets').style.opacity=state.streets?1:.55;styleMap()};
el('search').oninput=e=>{state.q=e.target.value;renderTrains();renderMarkers()};
el('refresh').onclick=load;
el('disruptionClose').onclick=()=>{state.disruptDismissed=true;el('disruptionBar').classList.add('hidden')};
window.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')zoom(1.3);if(e.key==='-')zoom(1/1.3);if(e.key==='0')el('reset').click()});

setInterval(()=>{
  state.countdown--;
  el('updated').textContent=state.live
    ?`updated ${new Date(state.lastLive).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · next in ${Math.max(0,state.countdown)}s`
    :`retrying in ${Math.max(0,state.countdown)}s`;
  if(state.countdown<=0)load();
  state.disruptCountdown--;
  if(!state.disruptDismissed)el('disruptionRefresh').textContent=`next check in ${Math.max(0,Math.round(state.disruptCountdown))}s`;
  if(state.disruptCountdown<=0)loadDisruptions();
},1000);

buildMap();render();loadNetwork();load();loadDisruptions();
})();
</script>
